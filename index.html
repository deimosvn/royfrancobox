<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso — Roy Franco Box</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RoyBox">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120x120.png">

    <!-- Theme -->
    <meta name="theme-color" content="#0B0F1A">
    <meta name="msapplication-TileColor" content="#0B0F1A">
    <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="icons/favicon.ico">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modern.css">

    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</head>
<body>

<main class="login-page">
    <div class="login-card">

        <!-- Brand -->
        <div class="login-brand">
            <img src="assets/images/logo.jpg" alt="Roy Franco Box" onerror="this.style.display='none'">
            <h1>ROY FRANCO BOX</h1>
            <p>Panel de Administración</p>
        </div>

        <!-- Error message -->
        <p class="login-error" id="loginError"></p>

        <!-- Login form -->
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">
                    <i class="fas fa-envelope" style="margin-right:.35rem;color:var(--primary);"></i>
                    Correo electrónico
                </label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="admin@royfrancobox.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">
                    <i class="fas fa-lock" style="margin-right:.35rem;color:var(--primary);"></i>
                    Contraseña
                </label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-full" style="margin-top:.5rem;">
                <i class="fas fa-sign-in-alt"></i>
                Iniciar sesión
            </button>
        </form>

        <!-- Register link -->
        <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--text-gray);">
            ¿Primera vez?
            <button type="button" id="openRegisterBtn"
                style="background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;font-size:.875rem;padding:0;">
                Crear cuenta con código secreto
            </button>
        </p>

    </div>
</main>

<!-- ── Register modal ────────────────────────────────────────── -->
<div id="registerModal" style="
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
    z-index:9999;align-items:center;justify-content:center;padding:1.5rem;">
    <div style="
        background:#fff;border-radius:20px;width:100%;max-width:420px;
        box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;animation:modalIn .25s ease;">
        <div style="background:var(--primary);padding:1.5rem 1.75rem;display:flex;justify-content:space-between;align-items:center;">
            <h3 style="color:#fff;font-size:1.1rem;margin:0;">
                <i class="fas fa-user-plus" style="margin-right:.5rem;"></i>Crear cuenta
            </h3>
            <button id="closeRegisterBtn" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;">&times;</button>
        </div>
        <div style="padding:1.75rem;">
            <p id="registerError" style="color:var(--danger);font-size:.85rem;margin-bottom:.75rem;display:none;"></p>
            <p id="registerSuccess" style="color:var(--success);font-size:.85rem;margin-bottom:.75rem;display:none;"></p>

            <div class="form-group">
                <label><i class="fas fa-envelope" style="color:var(--primary);margin-right:.3rem;"></i>Correo</label>
                <input type="email" id="regEmail" placeholder="tu@correo.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock" style="color:var(--primary);margin-right:.3rem;"></i>Contraseña</label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock" style="color:var(--primary);margin-right:.3rem;"></i>Confirmar contraseña</label>
                <input type="password" id="regPasswordConfirm" placeholder="Repite tu contraseña">
            </div>
            <div class="form-group">
                <label><i class="fas fa-key" style="color:var(--primary);margin-right:.3rem;"></i>Código secreto</label>
                <input type="password" id="regSecretCode" placeholder="Código de acceso">
            </div>
            <button id="registerBtn" class="btn btn-primary btn-full" style="margin-top:.25rem;">
                <i class="fas fa-user-plus"></i> Registrarme
            </button>
        </div>
    </div>
</div>

<style>
@keyframes modalIn {
    from { transform: translateY(-20px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
}
</style>

<script type="module">
    import { loginAdmin, onAuthChange, registerAdmin } from './js/firebase.js';

    // If already authenticated, go straight to dashboard
    onAuthChange(user => {
        if (user) window.location.replace('dashboard.html');
    });

    // ── Login ──────────────────────────────────────────────────
    const form     = document.getElementById('loginForm');
    const errorEl  = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async e => {
        e.preventDefault();
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            errorEl.textContent = 'Por favor ingresa tu correo y contraseña.';
            return;
        }

        loginBtn.disabled    = true;
        loginBtn.textContent = 'Verificando…';
        errorEl.textContent  = '';

        try {
            await loginAdmin(email, password);
        } catch (err) {
            const messages = {
                'auth/user-not-found':      'Usuario no registrado.',
                'auth/wrong-password':       'Contraseña incorrecta.',
                'auth/invalid-email':        'Correo inválido.',
                'auth/too-many-requests':    'Demasiados intentos. Intenta más tarde.',
                'auth/invalid-credential':   'Correo o contraseña incorrectos.',
            };
            errorEl.textContent = messages[err.code] || 'Error al iniciar sesión. Intenta de nuevo.';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginPassword').focus();
        } finally {
            loginBtn.disabled  = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
        }
    });

    ['loginEmail', 'loginPassword'].forEach(id =>
        document.getElementById(id).addEventListener('input', () => { errorEl.textContent = ''; })
    );

    // ── Register modal ─────────────────────────────────────────
    const modal       = document.getElementById('registerModal');
    const openBtn     = document.getElementById('openRegisterBtn');
    const closeBtn    = document.getElementById('closeRegisterBtn');
    const registerBtn = document.getElementById('registerBtn');
    const regError    = document.getElementById('registerError');
    const regSuccess  = document.getElementById('registerSuccess');

    function showModal()  { modal.style.display = 'flex'; }
    function hideModal()  { modal.style.display = 'none'; clearRegForm(); }
    function clearRegForm() {
        ['regEmail','regPassword','regPasswordConfirm','regSecretCode'].forEach(id => {
            document.getElementById(id).value = '';
        });
        regError.style.display   = 'none';
        regSuccess.style.display = 'none';
    }

    openBtn.addEventListener('click', showModal);
    closeBtn.addEventListener('click', hideModal);
    modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });

    registerBtn.addEventListener('click', async () => {
        const email    = document.getElementById('regEmail').value.trim();
        const pass     = document.getElementById('regPassword').value;
        const passConf = document.getElementById('regPasswordConfirm').value;
        const code     = document.getElementById('regSecretCode').value;

        regError.style.display   = 'none';
        regSuccess.style.display = 'none';

        if (!email || !pass || !passConf || !code) {
            regError.textContent = 'Completa todos los campos.';
            regError.style.display = 'block'; return;
        }
        if (pass !== passConf) {
            regError.textContent = 'Las contraseñas no coinciden.';
            regError.style.display = 'block'; return;
        }
        if (pass.length < 6) {
            regError.textContent = 'La contraseña debe tener al menos 6 caracteres.';
            regError.style.display = 'block'; return;
        }

        registerBtn.disabled  = true;
        registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando…';

        try {
            await registerAdmin(email, pass, code);
            regSuccess.textContent   = '¡Cuenta creada! Redirigiendo…';
            regSuccess.style.display = 'block';
            setTimeout(() => window.location.replace('dashboard.html'), 1200);
        } catch (err) {
            const messages = {
                'WRONG_CODE':             'Código secreto incorrecto.',
                'NO_SECRET_DOC':          'El código secreto no está configurado en la base de datos.',
                'auth/email-already-in-use': 'Este correo ya tiene una cuenta.',
                'auth/invalid-email':        'Correo inválido.',
                'auth/weak-password':        'Contraseña demasiado débil (mín. 6 caracteres).',
            };
            regError.textContent   = messages[err.message] || messages[err.code] || 'Error al crear cuenta.';
            regError.style.display = 'block';
        } finally {
            registerBtn.disabled  = false;
            registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Registrarme';
        }
    });
</script>

</body>
</html>
